name: Refresh Korean game prices

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-game-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run refresh
      - run: npm run validate
      - name: Publish verified changes
        run: |
          if git diff --quiet -- public/payroute-products.json; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "payroute-catalog-bot"
          git config user.email "payroute-catalog-bot@users.noreply.github.com"
          git add public/payroute-products.json
          git commit -m "chore: refresh Korean game prices"
          git push
